apiVersion: apps/v1
kind: Deployment
metadata:
  name: recreate-deploy
  labels:
    app: nginx-deploy
spec:
  replicas: 4
  selector:
    matchLabels:
     app: nginx-deploy
    matchExpressions:
     - key: env
       operator: In
       values:
         - dev
  strategy:
   type: Recreate
  template:
    metadata:
      labels:
        app: nginx-deploy
        env: dev
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata: 
 name: rs-svc
spec: 
 selector:
   app: nginx
 type: NodePort
 ports:
  - name: http
    port: 80
    targetPort: 80
