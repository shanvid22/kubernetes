apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs-pod
  labels:
    app: nginx-rs
spec:
  replicas: 3
  selector:
    matchLabels:
     app: nginx-rs
    matchExpressions:
     - key: env
       operator: In
       values:
         - dev
  template:
    metadata:
      labels:
        app: nginx-rs
        env: dev
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata: 
 name: rs-svc
spec: 
 selector:
   app: nginx
 type: NodePort
 ports:
  - name: http
    port: 80
    targetPort: 80
